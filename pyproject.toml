[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-ad-overlay"
version = "0.1.0"
description = "Twitch ad-break OBS overlay backend (local OAuth + ad-schedule/EventSub bridge)"
readme = "SETUP.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "websocket-client>=1.7.0",
]

[project.scripts]
twitch-ad-overlay = "twitch_ad_overlay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/twitch-ad-overlay" = ["ad-overlay.html"]
